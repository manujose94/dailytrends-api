apiVersion: 1

providers:
  - name: 'K6 Dashboards'
    orgId: 1
    updateIntervalSeconds: 100000
    folder: ''
    type: file
    allowUiUpdates: true
    disableDeletion: false
    editable: true
    options:
      path: /usr/lib/dashboards
      foldersFromFilesStructure: true
      #path: /var/lib/grafana/dashboards
      #path: /etc/grafana/provisioning/dashboards
